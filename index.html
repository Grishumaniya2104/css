<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkit</title>
    <link rel="stylesheet" href="<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"

     crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./style.css"/>
   
</head>
<body>
    <header class="navbar">

   <div class="logo"></div>

   <div class="Location">

    <br>
    <p>Bhavnagar</p>
   </div>

   <input type="text"class="search" placeholder="Search items"/>

   <button class="my-cart"><i class="fa-solid fa-cart-shopping">My cart</i></button>
    </header>
    <hr>

    <main>
        <div class="container">
            <section id="hero-banner">
                <img src="./assets/hero-banner.jpg" alt="Hero-banner">
            </section>

            <section id="banner">
                <img src="./assets/banner-1.jpg" alt="banner-1">
                <img src="./assets/banner-2.png" alt="banner-2">
                <img src="./assets/banner-3.png" alt="banner-3">
            </section>
            <section id="card">
                <img src="./assets/card-1.jpg" alt="card-1">
                <img src="./assets/card-2.png" alt="card-2">
                <img src="./assets/card-3.png" alt="card-3">
                <img src="./assets/card-4.png" alt="card-4">

                <img src="./assets/card-16.png" alt="card-16">

                <img src="./assets/card-18.png" alt="card-18">
                <img src="./assets/card-19.png" alt="card-19">
                <img src="./assets/card-20.png" alt="card-20"> 
                </section>
                
                <h1 class="heading">Dairy,Bread & Eggs</h1>
                <br>
                
                <section id="products">
                    <div class="product-details">
                        <img src="./assets/p-1.jpg" alt="Milk">
                        <h6 class="Prouduct-name">Amul Gold Full Cream Milk</h6>
                        <p class="quantity">500ml</p>
                        <div calss="Price">
                            <h4>₹35</h4>
                            <button class="add-btn">Add</button>
                        </div>
                    </div>
                    <div class="product-details">
                        <img src="./assets/p-2.png" alt="Milk">
                        <h6 class="Prouduct-name">Amul Tazza Toned Milk</h6>
                        <p class="quantity">500ml</p>
                        <div calss="Price">
                            <h4>₹29</h4>
                            <button class="add-btn">Add</button>
                        </div>
                    </div>

                    <div class="product-details">
                        <img src="./assets/p-3.png" alt="curd">
                        <h6 class="Prouduct-name">Amul Masti Pouch curd</h6>
                        <p class="quantity">1kg</p>

                    <div class="product-details">
                        <img src="./assets/p-6.png" alt="curd">
                        <h6 class="Prouduct-name">Amul Musti Pouch Curd</h6>
                        <p class="quantity">390g</p>
                        <div calss="Price">

                        </div>
                    </div>
